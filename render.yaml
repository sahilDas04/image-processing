services:
  - type: web
    name: image-processing-api
    runtime: docker
    rootDir: server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # Comma-separated list of browser origins allowed to call this API.
      # Must NOT contain '*' — the app refuses to boot on a wildcard CORS policy.
      - key: ALLOWED_ORIGINS
        sync: false
      # Canonical production frontend origin. Used to validate the OAuth
      # redirect_uri sent by the SPA, so login works without hardcoded hosts.
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Cloudinary for persistent media storage. Render's free-tier filesystem is
      # ephemeral: anything written to server/data is lost on redeploy/restart.
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Free instances have 512 MB RAM and uploads are buffered in memory before
      # decoding, so the 2560 MB default OOM-kills the process. Raise only with a
      # paid plan.
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: DEBUG_OPENAPI
        value: "false"